name: LINE Investment Reports (Manual Test)

on:
  workflow_dispatch:
    inputs:
      report:
        description: "Report to send"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - evening

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Vercel report push
        env:
          BASE_URL: ${{ secrets.VERCEL_BASE_URL }}
          PUSH_SECRET: ${{ secrets.PUSH_API_SECRET }}
          REPORT: ${{ inputs.report }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${BASE_URL:-https://sdd-md-github-vercel-johnnyaver-gma.vercel.app}"
          RESPONSE=$(curl --fail-with-body --retry 3 --retry-delay 10 \
            -H "Authorization: Bearer ${PUSH_SECRET}" \
            "${BASE_URL}/api/cron/${REPORT}-report")
          echo "$RESPONSE"
